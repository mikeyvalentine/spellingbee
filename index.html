<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ABCStefan-Simple-Trial.woff2" crossorigin />
    <title>Spelling Bee</title>
    <style>
      /* Chalkboard / keystroke font (DINAMO ABC Stefan Simple, trial). */
      @font-face {
        font-family: "ABC Stefan Simple";
        src: url("/fonts/ABCStefan-Simple-Trial.woff2") format("woff2"),
             url("/fonts/ABCStefan-Simple-Trial.woff") format("woff");
        font-weight: 400 900;
        font-display: swap;
      }
      :root {
        --bee: #ffd23b;
        --bee-deep: #f0a500;
        --ink: #e9edf5;
        --muted: #9aa4b2;
        --panel: rgba(14, 17, 24, 0.86);
        --chalk: #f4f1e8;
        --board: #2f3d34;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

      /* tiny dev-mode tag */
      #mode {
        position: fixed; left: 10px; bottom: 8px; z-index: 30;
        font: 11px/1.3 system-ui, sans-serif; color: var(--muted);
        background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 6px;
        pointer-events: none; user-select: none;
      }

      /* ---------- Lobby (anchored top-left, over the 3D lobby view) ---------- */
      #lobby {
        position: fixed; left: 16px; top: 16px; z-index: 20; display: none;
        color: var(--ink); text-align: center;
      }
      .lobby-card {
        width: max-content; min-width: 360px; max-width: 96vw;
        background: rgba(40, 62, 46, 0.86); border: 1px solid rgba(244,241,232,0.12);
        border-radius: 16px; padding: 14px 16px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      }
      .lobby-logo { font-size: 30px; line-height: 1; }
      .lobby-title {
        font-family: "ABC Stefan Simple", system-ui, sans-serif;
        font-size: 28px; font-weight: 600; letter-spacing: 0.5px; margin: 2px 0 12px;
      }

      .modes { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
      .mode {
        position: relative; text-align: left; cursor: pointer; user-select: none;
        background: #161b25; border: 2px solid #232a38; border-radius: 12px; padding: 11px 12px;
        transition: border-color 0.12s, transform 0.08s, background 0.12s;
      }
      .mode:hover { background: #1b212d; }
      .mode.selected { border-color: var(--bee); background: #1d2230; }
      .mode.locked { opacity: 0.5; cursor: not-allowed; }
      .mode .m-name { font-weight: 700; font-size: 14px; }
      .mode .m-desc { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
      .mode .m-soon {
        position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 700;
        color: #0b0d12; background: var(--muted); border-radius: 5px; padding: 2px 5px;
      }

      .roster {
        display: grid; grid-template-columns: repeat(4, auto); gap: 6px 16px;
        margin-bottom: 12px; min-height: 20px; font-size: 12px; justify-content: start;
      }
      .roster-row {
        display: flex; align-items: center; gap: 5px; justify-content: flex-start;
        font-size: 12px; white-space: nowrap;
      }
      .roster-row .tick { width: 15px; flex: none; }
      .roster-name.host { color: #5b8cff; font-weight: 700; }
      .roster-empty { grid-column: 1 / -1; color: var(--muted); font-style: italic; font-size: 13px; }

      .lobby-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .btn {
        font: 600 14px system-ui, sans-serif; border: 0; border-radius: 10px;
        padding: 11px 18px; cursor: pointer; color: #0b0d12; background: var(--bee);
        transition: transform 0.06s, filter 0.12s;
      }
      .btn:hover { filter: brightness(1.05); }
      .btn:active { transform: translateY(1px); }
      .btn.secondary { background: #2a3344; color: var(--ink); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
      .lobby-hint { color: var(--muted); font-size: 12px; margin-top: 12px; min-height: 1em; }
      .lobby-sub { color: var(--muted); font-size: 12px; margin: -6px 0 10px; min-height: 0; }
      .lobby-sub .code { color: var(--bee); font-weight: 700; letter-spacing: 1px; }

      .lobby-countdown { display: none; margin: 0 0 12px; }
      .lobby-countdown.on { display: block; }
      .lobby-countdown .cd-num {
        font: 700 30px "ABC Stefan Simple", system-ui, sans-serif; color: var(--bee); line-height: 1;
      }
      .lobby-countdown .cd-label { color: var(--muted); font-size: 12px; margin-top: 2px; }

      /* ---------- Public matchmaking overlay ---------- */
      #mm-overlay {
        position: fixed; inset: 0; z-index: 25; display: none;
        align-items: center; justify-content: center;
        background: rgba(6, 10, 8, 0.6); backdrop-filter: blur(3px);
      }
      #mm-overlay.on { display: flex; }
      .mm-card {
        width: min(420px, 94vw); max-height: 86vh; overflow-y: auto;
        background: rgba(40, 62, 46, 0.96); border: 1px solid rgba(244,241,232,0.14);
        border-radius: 16px; padding: 16px 18px; color: var(--ink);
        box-shadow: 0 18px 60px rgba(0,0,0,0.6);
      }
      .mm-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .mm-title { font-family: "ABC Stefan Simple", system-ui, sans-serif; font-size: 22px; font-weight: 600; }
      .mm-close {
        background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px;
      }
      .mm-close:hover { color: var(--ink); }
      .mm-actions { display: flex; gap: 10px; margin-bottom: 16px; }
      .mm-actions .btn { flex: 1; }
      .mm-list-head {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 12px; color: var(--muted); margin-bottom: 8px;
      }
      .mm-refresh { background: none; border: 0; color: var(--bee); font-size: 12px; cursor: pointer; }
      .mm-list { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
      .mm-empty { color: var(--muted); font-style: italic; font-size: 13px; text-align: center; padding: 12px 0; }
      .mm-room {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        background: #161b25; border: 1px solid #232a38; border-radius: 10px; padding: 9px 12px;
      }
      .mm-room .mm-room-code { font-weight: 700; letter-spacing: 1px; }
      .mm-room .mm-room-meta { color: var(--muted); font-size: 12px; }
      .mm-room .mm-join {
        font: 600 12px system-ui, sans-serif; border: 0; border-radius: 8px;
        padding: 7px 13px; cursor: pointer; color: #0b0d12; background: var(--bee);
      }
      .mm-room .mm-join:disabled { opacity: 0.45; cursor: not-allowed; }

      /* ---------- Match HUD ---------- */
      #match-hud {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        z-index: 15; width: min(520px, 94vw); display: none; text-align: center;
        background: var(--panel); border: 1px solid #232a38; border-radius: 14px;
        padding: 13px 16px 14px; color: var(--ink);
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      }
      #m-who { font-weight: 700; font-size: 16px; }
      #m-round { font-size: 12px; color: var(--muted); margin-top: 1px; }
      #m-input {
        display: block; width: 100%; margin: 11px 0 6px;
        font: 600 19px system-ui, sans-serif; text-align: center; letter-spacing: 3px;
        text-transform: uppercase; padding: 11px; border-radius: 10px;
        border: 2px solid #2a3344; background: #11151c; color: #fff; outline: none;
      }
      #m-input:focus { border-color: var(--bee); }
      #m-controls { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 4px; }
      #m-replay {
        background: #2a3344; color: var(--ink); border: 0; border-radius: 9px;
        padding: 8px 14px; cursor: pointer; font: 600 13px system-ui, sans-serif;
      }
      #m-replay:hover { background: #3a4658; }
      #m-timer { height: 7px; background: #2a3344; border-radius: 4px; overflow: hidden; margin-top: 11px; }
      #m-timerbar { height: 100%; width: 100%; background: var(--bee); transition: width 0.05s linear; }
      #m-status { margin-top: 9px; min-height: 1.2em; font-size: 14px; }
      #m-alive { font-size: 12px; color: var(--muted); margin-top: 2px; }

      /* ---------- Board corner buttons (replay / confirm) ---------- */
      /* left/top are set per-frame in JS; the anchoring transform + hover live here. */
      #board-replay, #board-check { transition: transform 0.12s ease, filter 0.12s ease; }
      #board-replay { transform: translate(10px, calc(-100% - 4px)); transform-origin: left bottom; }
      #board-replay:hover {
        transform: translate(10px, calc(-100% - 4px)) scale(1.12);
        filter: drop-shadow(0 0 5px rgba(255,255,255,0.4));
      }
      #board-check { transform: translate(calc(-100% - 10px), calc(-100% - 2px)); transform-origin: right bottom; }
      #board-check:hover {
        transform: translate(calc(-100% - 10px), calc(-100% - 2px)) scale(1.12);
        filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
      }

      /* ---------- Top-right universal menu ---------- */
      #menu-btn {
        position: fixed; top: 14px; right: 14px; z-index: 30;
        width: 44px; height: 44px; border-radius: 10px; border: 1px solid #2a3344;
        background: rgba(12,15,22,0.82); color: #e9edf5; font-size: 19px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4); padding: 0;
      }
      #menu-btn:hover { background: rgba(24,30,42,0.92); }
      #menu-panel {
        position: fixed; top: 66px; right: 14px; z-index: 30; display: none;
        min-width: 210px; background: rgba(14,17,24,0.97); border: 1px solid #2a3344;
        border-radius: 12px; padding: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      }
      #menu-panel.on { display: block; }
      .menu-item {
        display: block; width: 100%; text-align: left; background: none; border: 0;
        color: #e9edf5; font: 600 14px system-ui, sans-serif; padding: 11px 12px;
        border-radius: 8px; cursor: pointer;
      }
      .menu-item:hover { background: #1b212d; }
      .menu-item.danger { color: #ff8a8a; }
      .menu-item.disabled { color: var(--muted); cursor: default; }
      .menu-item.disabled:hover { background: none; }
      .menu-sep { height: 1px; background: #232a38; margin: 6px 4px; }

      /* Tomato power-up is now a 3D object (src/tomato.ts); its only DOM is the
         hover tooltip (#tomato-tip), styled inline in bee.ts. */

      /* ---------- Clipboard lobby (3D prop + HTML "paper" controls) ---------- */
      #clip-peek {
        position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
        z-index: 20; display: none; cursor: pointer; user-select: none;
        background: rgba(40,62,46,0.92); color: #f4f1e8;
        border: 1px solid rgba(244,241,232,0.16); border-bottom: 0;
        border-radius: 12px 12px 0 0; padding: 10px 22px 14px;
        font: 700 15px system-ui, sans-serif; box-shadow: 0 -6px 24px rgba(0,0,0,0.45);
        transition: transform 0.16s ease; white-space: nowrap;
      }
      #clip-peek.show { display: block; }
      /* Unified hover: hovering the strip OR the 3D clipboard raises both (lobby.ts toggles .hot). */
      #clip-peek.hot { transform: translateX(-50%) translateY(-6px); }
      #clip-peek #clip-peek-text { font: 700 19px "ABC Stefan Simple", system-ui, sans-serif; letter-spacing: 0.3px; }
      #clip-peek .cp-peek-hint { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: 10px; }

      #clip-panel { position: fixed; z-index: 21; display: none; flex-direction: column; }
      #clip-panel.show { display: flex; }
      #clip-close {
        align-self: center; width: 56px; height: 22px; border: 0; margin-bottom: 6px;
        border-radius: 0 0 11px 11px; background: rgba(18,22,18,0.9); color: #f4f1e8;
        cursor: pointer; font-size: 12px;
      }
      #clip-paper {
        flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
        background: #f4efe2; color: #2a2620; border-radius: 7px;
        padding: 13px 18px 15px; box-shadow: 0 18px 50px rgba(0,0,0,0.55);
        font-family: system-ui, sans-serif;
      }
      .cp-header { font: 600 30px "ABC Stefan Simple", system-ui, sans-serif; letter-spacing: 0.3px; margin-bottom: 6px; }
      .cp-header .cp-count { color: #6a6256; font: 700 15px system-ui, sans-serif; }
      .cp-cd { color: #b8860b; font-weight: 700; font-size: 13px; margin-left: 8px; }
      .cp-section { border-top: 1px solid #d9d2c2; padding: 9px 0; }
      .cp-label { font: 700 12px system-ui, sans-serif; text-transform: uppercase; letter-spacing: 0.5px; color: #8a8170; margin-bottom: 6px; }
      .cp-srow { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; gap: 10px; }
      .cp-srow > label { font-weight: 600; font-size: 14px; }
      .cp-srow select, .cp-srow .cp-stepper, .cp-srow .cp-toggle { font-size: 14px; }
      .cp-srow select { padding: 6px 8px; border-radius: 8px; border: 1px solid #c9c1b0; background: #fff; color: #2a2620; }
      .cp-srow select:disabled { opacity: 0.7; }
      .cp-stepper { display: inline-flex; align-items: center; gap: 4px; }
      .cp-stepper button { width: 28px; height: 28px; border: 1px solid #c9c1b0; background: #fff; border-radius: 7px; cursor: pointer; font-weight: 700; }
      .cp-stepper button:disabled { opacity: 0.4; cursor: not-allowed; }
      .cp-stepper span { min-width: 22px; text-align: center; font-weight: 700; }
      .cp-toggle { display: inline-flex; border: 1px solid #c9c1b0; border-radius: 8px; overflow: hidden; }
      .cp-toggle button { border: 0; background: #fff; color: #2a2620; padding: 6px 12px; cursor: pointer; font-weight: 600; }
      .cp-toggle button.on { background: var(--bee); color: #2a2010; }
      .cp-toggle button:disabled { cursor: not-allowed; }
      .cp-roster { display: flex; flex-direction: column; gap: 4px; }
      .cp-prow { display: flex; align-items: center; gap: 7px; font-size: 14px; }
      .cp-prow .cp-tick { width: 16px; }
      .cp-prow .cp-name.host { color: #2a6df0; font-weight: 800; }
      .cp-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; }
      .cp-actions .cpb {
        font: 700 14px system-ui, sans-serif; border: 0; border-radius: 9px;
        padding: 11px 16px; cursor: pointer; color: #2a2010; background: var(--bee); flex: 1 1 auto;
      }
      .cp-actions .cpb.sec { background: #e3ddcd; color: #2a2620; }
      .cp-actions .cpb:hover { filter: brightness(1.04); }
      .cp-find-actions { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
      .cp-find-actions .cpb { flex: 1; }
      .cp-refresh { background: none; border: 0; color: #2a6df0; font-size: 13px; cursor: pointer; }
      .cp-list { display: flex; flex-direction: column; gap: 6px; }
      .cp-room { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 1px solid #ddd5c4; border-radius: 9px; padding: 8px 11px; }
      .cp-room .cp-room-code { font-weight: 800; letter-spacing: 1px; }
      .cp-room .cp-room-meta { color: #8a8170; font-size: 12px; }
      .cp-room .cp-join { border: 0; border-radius: 7px; padding: 6px 12px; background: var(--bee); color: #2a2010; font-weight: 700; cursor: pointer; }
      .cp-room .cp-join:disabled { opacity: 0.45; cursor: not-allowed; }
      .cp-empty { color: #8a8170; font-style: italic; font-size: 13px; text-align: center; padding: 8px 0; }

      /* ---------- Rotate-to-landscape nudge (touch + portrait only) ---------- */
      #rotate-nudge {
        position: fixed; inset: 0; z-index: 60; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #0b0d12; color: var(--ink); text-align: center; padding: 24px;
        font: 600 18px system-ui, sans-serif;
      }
      #rotate-nudge .rn-icon { font-size: 52px; animation: rn-rock 1.6s ease-in-out infinite; }
      #rotate-nudge .rn-sub { color: var(--muted); font-size: 14px; font-weight: 500; }
      @keyframes rn-rock { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(78deg); } }
      @media (pointer: coarse) and (orientation: portrait) {
        #rotate-nudge { display: flex; }
      }

      /* ---------- Slim mobile match bar (reuses #match-hud) ---------- */
      /* On touch devices the speller has no physical keyboard, so #match-hud
         becomes a compact bottom bar: a real editable input (raises the native
         keyboard) + replay + timer. The verbose rows are hidden to stay minimal. */
      #match-hud.mobile-bar {
        width: min(640px, 96vw); padding: 8px 10px;
        bottom: max(8px, env(safe-area-inset-bottom));
        display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
      }
      #match-hud.mobile-bar #m-who,
      #match-hud.mobile-bar #m-round,
      #match-hud.mobile-bar #m-alive { display: none; }
      #match-hud.mobile-bar #m-input {
        flex: 1 1 auto; margin: 0; padding: 10px; font-size: 18px; letter-spacing: 2px;
      }
      #match-hud.mobile-bar #m-controls { margin: 0; flex: none; }
      #match-hud.mobile-bar #m-replay { padding: 10px 12px; font-size: 16px; }
      #match-hud.mobile-bar #m-timer {
        position: absolute; left: 10px; right: 10px; bottom: 3px; margin: 0; height: 4px;
      }
      #match-hud.mobile-bar #m-status {
        display: none; /* keep the bar to one row; status echoes on the 3D board */
      }
      /* When it's not the local player's turn, hide the input + Enter, leave replay. */
      #match-hud.mobile-bar.no-input #m-input { display: none; }

      /* ---------- Lobby responsive reflow ---------- */
      /* Narrow widths (portrait phones, small windows): full-width card, fewer
         roster columns, stacked tap-friendly buttons. */
      @media (max-width: 560px) {
        #lobby { left: 8px; right: 8px; top: 8px; }
        .lobby-card { min-width: 0; width: auto; max-width: none; }
        .roster { grid-template-columns: repeat(2, 1fr); gap: 6px 10px; }
        .lobby-actions { flex-direction: column; }
        .btn { width: 100%; padding: 14px 18px; }
        #class-title { font-size: 18px !important; }
      }
      /* Short heights (landscape phones): the card must not exceed the screen —
         scroll it, and tighten the vertical rhythm. */
      @media (max-height: 480px) {
        .lobby-card {
          max-height: calc(100vh - 16px); overflow-y: auto;
          padding: 10px 14px; -webkit-overflow-scrolling: touch;
        }
        .lobby-logo { font-size: 22px; }
        .lobby-title { font-size: 22px; margin: 0 0 8px; }
        .modes { margin-bottom: 8px; gap: 6px; }
        .mode { padding: 8px 10px; }
        .roster { margin-bottom: 8px; }
        .lobby-hint { margin-top: 8px; }
      }

      /* ---------- Mobile lobby: split the card up ----------
         Bee icon + bare player names top-left (no box, drop-shadow for contrast);
         the action buttons spaced evenly along the bottom of the screen. */
      @media (pointer: coarse) {
        #lobby {
          left: max(10px, env(safe-area-inset-left)); right: auto;
          top: max(10px, env(safe-area-inset-top));
        }
        .lobby-card {
          background: none; border: 0; box-shadow: none; padding: 0;
          min-width: 0; width: auto; max-width: 62vw; max-height: none; overflow: visible;
        }
        .lobby-title, .modes, .lobby-hint { display: none; }
        #class-title { display: none !important; }
        .lobby-logo {
          font-size: 30px; line-height: 1; margin-bottom: 6px;
          text-shadow: 0 2px 8px rgba(0,0,0,0.75);
        }

        /* Player list: bare names with a drop-shadow, no background. */
        .roster {
          display: flex; flex-direction: column; align-items: flex-start;
          grid-template-columns: none; gap: 3px; margin: 0; min-height: 0;
        }
        .roster-row { background: none; white-space: nowrap; }
        .roster-row .tick { text-shadow: 0 2px 5px rgba(0,0,0,0.85); }
        .roster-name {
          font-size: 15px; font-weight: 700;
          text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8);
        }
        .roster-empty { text-shadow: 0 2px 6px rgba(0,0,0,0.9); }

        /* Action buttons spread evenly across the bottom of the page. */
        .lobby-actions {
          position: fixed; left: 0; right: 0;
          bottom: max(12px, env(safe-area-inset-bottom));
          flex-direction: row; flex-wrap: nowrap; justify-content: space-evenly;
          align-items: center; gap: 8px; padding: 0 12px; z-index: 22;
        }
        .lobby-actions .btn {
          width: auto; flex: 0 1 auto; padding: 12px 14px; font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>

    <!-- Shown during load/auth until the first lobby state arrives. -->
    <div id="connecting" style="position:fixed; inset:0; z-index:50; display:flex;
      flex-direction:column; align-items:center; justify-content:center; gap:10px;
      background:#0d1018; color:#e9edf5; font:600 18px system-ui, sans-serif;">
      <div style="font-size:44px">🐝</div>
      <div>Connecting…</div>
    </div>

    <!-- 2D lobby landing screen -->
    <div id="lobby">
      <div class="lobby-card">
        <div class="lobby-logo">🐝</div>
        <div class="lobby-title">Spelling Bee</div>
        <div class="lobby-sub" id="lobby-sub"></div>

        <div class="lobby-countdown" id="lobby-countdown"></div>

        <div class="modes" id="modes"></div>

        <div class="roster" id="roster"></div>

        <div class="lobby-actions" id="lobby-actions"></div>
        <div class="lobby-hint" id="lobby-hint"></div>
      </div>
    </div>

    <!-- Public matchmaking overlay (quick match / room browser) -->
    <div id="mm-overlay">
      <div class="mm-card">
        <div class="mm-head">
          <div class="mm-title">🌐 Play Public</div>
          <button class="mm-close" id="mm-close">✕</button>
        </div>
        <div class="mm-actions">
          <button class="btn" id="mm-quick">⚡ Quick Match</button>
          <button class="btn secondary" id="mm-create">＋ Create Room</button>
        </div>
        <div class="mm-list-head">
          <span>Open rooms</span>
          <button class="mm-refresh" id="mm-refresh">↻ Refresh</button>
        </div>
        <div class="mm-list" id="mm-list"></div>
      </div>
    </div>

    <!-- In-match HUD (the live word display lives on the 3D chalkboard) -->
    <div id="match-hud">
      <div id="m-who"></div>
      <div id="m-round"></div>
      <input id="m-input" type="text" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" placeholder="type the word, then Enter" />
      <div id="m-controls">
        <button id="m-replay">🔊 Replay word</button>
      </div>
      <div id="m-timer"><div id="m-timerbar"></div></div>
      <div id="m-status"></div>
      <div id="m-alive"></div>
    </div>

    <!-- Clipboard lobby: peek strip (bottom) + paper panel (overlays the 3D paper) -->
    <div id="clip-peek"><span id="clip-peek-text">Lobby</span><span class="cp-peek-hint">click to open</span></div>
    <div id="clip-panel">
      <button id="clip-close" title="Close">▾ close</button>
      <div id="clip-paper">
        <div class="cp-header"><span id="cp-room">Lobby</span> <span class="cp-count" id="cp-count"></span><span class="cp-cd" id="cp-cd"></span></div>

        <div class="cp-section" id="cp-settings">
          <div class="cp-label">Room settings</div>
          <div class="cp-srow"><label>Game mode</label><select id="cp-mode"></select></div>
          <div class="cp-srow"><label>Max players</label>
            <div class="cp-stepper"><button id="cp-max-dec">−</button><span id="cp-max">8</span><button id="cp-max-inc">+</button></div>
          </div>
          <div class="cp-srow"><label>Room</label>
            <div class="cp-toggle" id="cp-vis"><button data-v="private">Private</button><button data-v="public">Public</button></div>
          </div>
        </div>

        <div class="cp-section">
          <div class="cp-label">Players</div>
          <div id="cp-roster" class="cp-roster"></div>
        </div>

        <div class="cp-actions" id="cp-actions"></div>

        <div class="cp-section" id="cp-find">
          <div class="cp-label">Find a public game</div>
          <div class="cp-find-actions">
            <button class="cpb" id="cp-quick">⚡ Quick Match</button>
            <button class="cpb sec" id="cp-create">＋ Create</button>
            <button class="cp-refresh" id="cp-refresh">↻ Refresh</button>
          </div>
          <div id="cp-list" class="cp-list"></div>
        </div>
      </div>
    </div>

    <!-- Top-right universal menu (always visible) -->
    <button id="menu-btn" title="Menu" aria-label="Menu">☰</button>
    <div id="menu-panel"><div id="menu-items"></div></div>

    <div id="mode">starting…</div>

    <!-- Shown only on touch devices held in portrait (match view needs landscape). -->
    <div id="rotate-nudge">
      <div class="rn-icon">📱</div>
      <div>Rotate your phone</div>
      <div class="rn-sub">Spelling Bee plays in landscape.</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
