<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Spelling Bee</title>
    <style>
      /* Chalkboard / keystroke font (DINAMO ABC Stefan Simple, trial). */
      @font-face {
        font-family: "ABC Stefan Simple";
        src: url("/fonts/ABCStefan-Simple-Trial.woff2") format("woff2"),
             url("/fonts/ABCStefan-Simple-Trial.woff") format("woff");
        font-weight: 400 900;
        font-display: swap;
      }
      :root {
        --bee: #ffd23b;
        --bee-deep: #f0a500;
        --ink: #e9edf5;
        --muted: #9aa4b2;
        --panel: rgba(14, 17, 24, 0.86);
        --chalk: #f4f1e8;
        --board: #2f3d34;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

      /* tiny dev-mode tag */
      #mode {
        position: fixed; left: 10px; bottom: 8px; z-index: 30;
        font: 11px/1.3 system-ui, sans-serif; color: var(--muted);
        background: rgba(0,0,0,0.35); padding: 4px 8px; border-radius: 6px;
        pointer-events: none; user-select: none;
      }

      /* ---------- Lobby (anchored top-left, over the 3D lobby view) ---------- */
      #lobby {
        position: fixed; left: 16px; top: 16px; z-index: 20; display: none;
        color: var(--ink); text-align: center;
      }
      .lobby-card {
        width: max-content; min-width: 360px; max-width: 96vw;
        background: rgba(40, 62, 46, 0.86); border: 1px solid rgba(244,241,232,0.12);
        border-radius: 16px; padding: 14px 16px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.55);
      }
      .lobby-logo { font-size: 30px; line-height: 1; }
      .lobby-title {
        font-family: "ABC Stefan Simple", system-ui, sans-serif;
        font-size: 28px; font-weight: 600; letter-spacing: 0.5px; margin: 2px 0 12px;
      }

      .modes { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
      .mode {
        position: relative; text-align: left; cursor: pointer; user-select: none;
        background: #161b25; border: 2px solid #232a38; border-radius: 12px; padding: 11px 12px;
        transition: border-color 0.12s, transform 0.08s, background 0.12s;
      }
      .mode:hover { background: #1b212d; }
      .mode.selected { border-color: var(--bee); background: #1d2230; }
      .mode.locked { opacity: 0.5; cursor: not-allowed; }
      .mode .m-name { font-weight: 700; font-size: 14px; }
      .mode .m-desc { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
      .mode .m-soon {
        position: absolute; top: 8px; right: 8px; font-size: 9px; font-weight: 700;
        color: #0b0d12; background: var(--muted); border-radius: 5px; padding: 2px 5px;
      }

      .roster {
        display: grid; grid-template-columns: repeat(4, auto); gap: 6px 16px;
        margin-bottom: 12px; min-height: 20px; font-size: 12px; justify-content: start;
      }
      .roster-row {
        display: flex; align-items: center; gap: 5px; justify-content: flex-start;
        font-size: 12px; white-space: nowrap;
      }
      .roster-row .tick { width: 15px; flex: none; }
      .roster-name.host { color: #5b8cff; font-weight: 700; }
      .roster-empty { grid-column: 1 / -1; color: var(--muted); font-style: italic; font-size: 13px; }

      .lobby-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .btn {
        font: 600 14px system-ui, sans-serif; border: 0; border-radius: 10px;
        padding: 11px 18px; cursor: pointer; color: #0b0d12; background: var(--bee);
        transition: transform 0.06s, filter 0.12s;
      }
      .btn:hover { filter: brightness(1.05); }
      .btn:active { transform: translateY(1px); }
      .btn.secondary { background: #2a3344; color: var(--ink); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }
      .lobby-hint { color: var(--muted); font-size: 12px; margin-top: 12px; min-height: 1em; }

      /* ---------- Match HUD ---------- */
      #match-hud {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        z-index: 15; width: min(520px, 94vw); display: none; text-align: center;
        background: var(--panel); border: 1px solid #232a38; border-radius: 14px;
        padding: 13px 16px 14px; color: var(--ink);
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      }
      #m-who { font-weight: 700; font-size: 16px; }
      #m-round { font-size: 12px; color: var(--muted); margin-top: 1px; }
      #m-input {
        display: block; width: 100%; margin: 11px 0 6px;
        font: 600 19px system-ui, sans-serif; text-align: center; letter-spacing: 3px;
        text-transform: uppercase; padding: 11px; border-radius: 10px;
        border: 2px solid #2a3344; background: #11151c; color: #fff; outline: none;
      }
      #m-input:focus { border-color: var(--bee); }
      #m-controls { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 4px; }
      #m-replay {
        background: #2a3344; color: var(--ink); border: 0; border-radius: 9px;
        padding: 8px 14px; cursor: pointer; font: 600 13px system-ui, sans-serif;
      }
      #m-replay:hover { background: #3a4658; }
      #m-timer { height: 7px; background: #2a3344; border-radius: 4px; overflow: hidden; margin-top: 11px; }
      #m-timerbar { height: 100%; width: 100%; background: var(--bee); transition: width 0.05s linear; }
      #m-status { margin-top: 9px; min-height: 1.2em; font-size: 14px; }
      #m-alive { font-size: 12px; color: var(--muted); margin-top: 2px; }

      /* ---------- Rotate-to-landscape nudge (touch + portrait only) ---------- */
      #rotate-nudge {
        position: fixed; inset: 0; z-index: 60; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #0b0d12; color: var(--ink); text-align: center; padding: 24px;
        font: 600 18px system-ui, sans-serif;
      }
      #rotate-nudge .rn-icon { font-size: 52px; animation: rn-rock 1.6s ease-in-out infinite; }
      #rotate-nudge .rn-sub { color: var(--muted); font-size: 14px; font-weight: 500; }
      @keyframes rn-rock { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(78deg); } }
      @media (pointer: coarse) and (orientation: portrait) {
        #rotate-nudge { display: flex; }
      }

      /* ---------- Slim mobile match bar (reuses #match-hud) ---------- */
      /* On touch devices the speller has no physical keyboard, so #match-hud
         becomes a compact bottom bar: a real editable input (raises the native
         keyboard) + replay + timer. The verbose rows are hidden to stay minimal. */
      #match-hud.mobile-bar {
        width: min(640px, 96vw); padding: 8px 10px;
        bottom: max(8px, env(safe-area-inset-bottom));
        display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
      }
      #match-hud.mobile-bar #m-who,
      #match-hud.mobile-bar #m-round,
      #match-hud.mobile-bar #m-alive { display: none; }
      #match-hud.mobile-bar #m-input {
        flex: 1 1 auto; margin: 0; padding: 10px; font-size: 18px; letter-spacing: 2px;
      }
      #match-hud.mobile-bar #m-controls { margin: 0; flex: none; }
      #match-hud.mobile-bar #m-replay { padding: 10px 12px; font-size: 16px; }
      #match-hud.mobile-bar #m-timer {
        position: absolute; left: 10px; right: 10px; bottom: 3px; margin: 0; height: 4px;
      }
      #match-hud.mobile-bar #m-status {
        display: none; /* keep the bar to one row; status echoes on the 3D board */
      }
      /* When it's not the local player's turn, hide the input + Enter, leave replay. */
      #match-hud.mobile-bar.no-input #m-input { display: none; }

      /* ---------- Lobby responsive reflow ---------- */
      /* Narrow widths (portrait phones, small windows): full-width card, fewer
         roster columns, stacked tap-friendly buttons. */
      @media (max-width: 560px) {
        #lobby { left: 8px; right: 8px; top: 8px; }
        .lobby-card { min-width: 0; width: auto; max-width: none; }
        .roster { grid-template-columns: repeat(2, 1fr); gap: 6px 10px; }
        .lobby-actions { flex-direction: column; }
        .btn { width: 100%; padding: 14px 18px; }
        #class-title { font-size: 18px !important; }
      }
      /* Short heights (landscape phones): the card must not exceed the screen —
         scroll it, and tighten the vertical rhythm. */
      @media (max-height: 480px) {
        .lobby-card {
          max-height: calc(100vh - 16px); overflow-y: auto;
          padding: 10px 14px; -webkit-overflow-scrolling: touch;
        }
        .lobby-logo { font-size: 22px; }
        .lobby-title { font-size: 22px; margin: 0 0 8px; }
        .modes { margin-bottom: 8px; gap: 6px; }
        .mode { padding: 8px 10px; }
        .roster { margin-bottom: 8px; }
        .lobby-hint { margin-top: 8px; }
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>

    <!-- Shown during load/auth until the first lobby state arrives. -->
    <div id="connecting" style="position:fixed; inset:0; z-index:50; display:flex;
      flex-direction:column; align-items:center; justify-content:center; gap:10px;
      background:#0d1018; color:#e9edf5; font:600 18px system-ui, sans-serif;">
      <div style="font-size:44px">🐝</div>
      <div>Connecting…</div>
    </div>

    <!-- 2D lobby landing screen -->
    <div id="lobby">
      <div class="lobby-card">
        <div class="lobby-logo">🐝</div>
        <div class="lobby-title">Spelling Bee</div>

        <div class="modes" id="modes"></div>

        <div class="roster" id="roster"></div>

        <div class="lobby-actions" id="lobby-actions"></div>
        <div class="lobby-hint" id="lobby-hint"></div>
      </div>
    </div>

    <!-- In-match HUD (the live word display lives on the 3D chalkboard) -->
    <div id="match-hud">
      <div id="m-who"></div>
      <div id="m-round"></div>
      <input id="m-input" type="text" autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false" placeholder="type the word, then Enter" />
      <div id="m-controls">
        <button id="m-replay">🔊 Replay word</button>
      </div>
      <div id="m-timer"><div id="m-timerbar"></div></div>
      <div id="m-status"></div>
      <div id="m-alive"></div>
    </div>

    <div id="mode">starting…</div>

    <!-- Shown only on touch devices held in portrait (match view needs landscape). -->
    <div id="rotate-nudge">
      <div class="rn-icon">📱</div>
      <div>Rotate your phone</div>
      <div class="rn-sub">Spelling Bee plays in landscape.</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
