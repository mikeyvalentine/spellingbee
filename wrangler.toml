name = "spelling-bee"
main = "worker/index.js"
compatibility_date = "2025-06-01"

# Built client (dist/) served by the Worker. run_worker_first = true routes every
# request through worker/index.js first; non-API paths fall through to
# env.ASSETS.fetch(), which serves dist/ with an index.html SPA fallback.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Game rooms + the public-matchmaking coordinator. SQLite-backed Durable Object
# classes -> available on the free plan.
[[durable_objects.bindings]]
name = "BEE_ROOM"
class_name = "BeeRoom"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BeeRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

# Non-secret config. The Discord *Client ID* is public (it's also baked into the
# client bundle). Secrets — DISCORD_CLIENT_SECRET and GOOGLE_TTS_API_KEY — are NOT
# here; set them with `wrangler secret put <NAME>` (or .dev.vars for local dev).
[vars]
DISCORD_CLIENT_ID = "1513352712400404520"
GOOGLE_TTS_VOICE = "en-US-Neural2-F"
GOOGLE_TTS_RATE = "0.9"
